<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A tiny to-do list that saves tasks in your browser.">
    <title>Todo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2937'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Todo</h1>
        <p class="subtitle">A tiny task list that stays on this device.</p>
      </header>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <label class="visually-hidden" for="todo-input">New task</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          maxlength="200"
          placeholder="What needs doing?"
          required
        >
        <button type="submit" class="add-button">Add</button>
      </form>

      <p id="storage-warning" class="storage-warning" role="status" hidden>
        Tasks can't be saved because browser storage is unavailable.
      </p>

      <p id="empty-state" class="empty-state">No tasks yet. Add one above to get started.</p>

      <ul id="todo-list" class="todo-list" aria-label="Tasks"></ul>

      <footer class="app-footer">Saved in this browser only.</footer>
    </main>
  </body>
</html>
